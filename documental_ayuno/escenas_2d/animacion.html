<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Documental 2D · ¿Qué le pasa a tu cuerpo cuando dejas de comer 7 días?</title>
<style>
html,body{margin:0;background:#0a1226;overflow:hidden}
svg{display:block}
text{font-family:'DejaVu Sans','Liberation Sans',Arial,sans-serif;font-weight:700}
</style></head><body>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1a38"/><stop offset="1" stop-color="#070d1e"/></linearGradient>
<radialGradient id="gLiver" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#c0583f"/><stop offset=".6" stop-color="#8d2f26"/><stop offset="1" stop-color="#5b1a1c"/></radialGradient>
<radialGradient id="gStomach" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#f2a29a"/><stop offset=".7" stop-color="#d36b6f"/><stop offset="1" stop-color="#a84552"/></radialGradient>
<radialGradient id="gBrain" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#ffc6cf"/><stop offset=".7" stop-color="#ee8fa0"/><stop offset="1" stop-color="#c25a78"/></radialGradient>
<radialGradient id="gHeart" cx=".4" cy=".3" r=".9"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".7" stop-color="#c8243a"/><stop offset="1" stop-color="#7d1226"/></radialGradient>
<radialGradient id="gFat" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#fff6c4"/><stop offset=".6" stop-color="#ffd86b"/><stop offset="1" stop-color="#e7a736"/></radialGradient>
<linearGradient id="gMuscle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2625a"/><stop offset=".5" stop-color="#b9363c"/><stop offset="1" stop-color="#7f1f2e"/></linearGradient>
<radialGradient id="gGold"><stop offset="0" stop-color="#fff2b0" stop-opacity="1"/><stop offset=".4" stop-color="#ffc83d" stop-opacity=".9"/><stop offset="1" stop-color="#ffb100" stop-opacity="0"/></radialGradient>
<radialGradient id="gCyan"><stop offset="0" stop-color="#e5ffff" stop-opacity="1"/><stop offset=".4" stop-color="#37d6ff" stop-opacity=".9"/><stop offset="1" stop-color="#00a8ff" stop-opacity="0"/></radialGradient>
<radialGradient id="gRed"><stop offset="0" stop-color="#ff6b6b" stop-opacity=".9"/><stop offset="1" stop-color="#ff2d4a" stop-opacity="0"/></radialGradient>
<radialGradient id="gWhite"><stop offset="0" stop-color="#ffffff" stop-opacity=".8"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<radialGradient id="gVig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a074"/><stop offset=".5" stop-color="#f0b98d"/><stop offset="1" stop-color="#d4996c"/></linearGradient>
<linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".25" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
<linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#58c4ff"/><stop offset="1" stop-color="#1b6fd1"/></linearGradient>
<linearGradient id="gGly" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#e8a300"/></linearGradient>
<linearGradient id="gFatL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd08a"/><stop offset="1" stop-color="#f08a2c"/></linearGradient>
<linearGradient id="gMusL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e26d77"/><stop offset="1" stop-color="#a22443"/></linearGradient>
</defs>
<g id="bg"></g><g id="sc"></g><g id="hud"></g>
</svg>
<script>
// ===================== utilidades =====================
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const sm=x=>{x=clamp(x);return x*x*(3-2*x)};
const pr=(t,a,b)=>clamp((t-a)/(b-a));
const E=(t,a,b)=>sm(pr(t,a,b));
const lerp=(a,b,k)=>a+(b-a)*k;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const f=n=>(Math.round(n*10)/10).toString();
const TAU=Math.PI*2;
const poly=(fn,n=56)=>{let s='';for(let i=0;i<=n;i++){const p=fn(i/n);s+=(i?'L':'M')+f(p[0])+' '+f(p[1])}return s};
const tube=(fn,w,c1,c2,o=1)=>{const d=poly(fn);return `<g opacity="${o}"><path d="${d}" fill="none" stroke="${c1}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c2}" stroke-width="${w*.7}" stroke-linecap="round" stroke-linejoin="round"/></g>`};
const circ=(x,y,r,fill,o=1,extra='')=>`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}" opacity="${o}" ${extra}/>`;
const glow=(x,y,r,id,o=1)=>circ(x,y,r,`url(#${id})`,o);
const txt=(x,y,s,size=34,fill='#fff',o=1,anchor='middle',extra='')=>`<text x="${f(x)}" y="${f(y)}" font-size="${size}" fill="${fill}" opacity="${o}" text-anchor="${anchor}" stroke="#050a18" stroke-width="${size*.16}" paint-order="stroke" stroke-linejoin="round" ${extra}>${s}</text>`;
const pill=(x,y,s,col,o=1,size=30)=>{const w=s.length*size*.64+44;return `<g opacity="${o}"><rect x="${f(x-w/2)}" y="${f(y-size*.95)}" width="${f(w)}" height="${f(size*1.6)}" rx="${f(size*.8)}" fill="${col}" fill-opacity=".92"/><text x="${f(x)}" y="${f(y+size*.1)}" font-size="${size}" fill="#06101f" text-anchor="middle">${s}</text></g>`};
const arrow=(x1,y1,x2,y2,col,o=1,w=10)=>{const a=Math.atan2(y2-y1,x2-x1),h=28;return `<g opacity="${o}" stroke="${col}" fill="${col}" stroke-linecap="round" stroke-linejoin="round"><line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2-Math.cos(a)*h*.6)}" y2="${f(y2-Math.sin(a)*h*.6)}" stroke-width="${w}"/><path d="M${f(x2)} ${f(y2)}L${f(x2-Math.cos(a-.5)*h)} ${f(y2-Math.sin(a-.5)*h)}L${f(x2-Math.cos(a+.5)*h)} ${f(y2-Math.sin(a+.5)*h)}Z" stroke="none"/></g>`};
const rbc=(x,y,ang,s=1,o=1)=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${f(ang)}) scale(${s})" opacity="${o}"><ellipse rx="15" ry="10" fill="#e8483f"/><ellipse rx="7" ry="4" fill="#b32428"/></g>`;
function flow(fn,n,speed,t,draw,phase=0){let s='';for(let i=0;i<n;i++){const u=((i/n+t*speed+phase)%1+1)%1;const p=fn(u),q=fn(Math.min(1,u+.01));s+=draw(p[0],p[1],Math.atan2(q[1]-p[1],q[0]-p[0])*180/Math.PI,i,u)}return s}
function bar(x,y,w,h,k,col,label,o=1,lab2=''){return `<g opacity="${o}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="#0a1328" stroke="#ffffff55" stroke-width="3"/><rect x="${x+4}" y="${y+4}" width="${f(Math.max(h-8,(w-8)*k))}" height="${h-8}" rx="${(h-8)/2}" fill="${col}"/>${txt(x,y-14,label,28,'#fff',1,'start')}${lab2?txt(x+w,y-14,lab2,26,'#ffd400',1,'end'):''}</g>`}

// ===================== órganos y personaje =====================
const liver=(x,y,s,rot=0)=>`<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${s})"><path d="M-200,-40C-190,-130 -40,-150 90,-110C190,-80 230,-20 210,40C180,110 60,130 -40,120C-130,110 -210,60 -200,-40Z" fill="url(#gLiver)"/><path d="M-120,-70C-40,-60 40,-30 120,-60" fill="none" stroke="#5b1a1c" stroke-width="7" opacity=".5" stroke-linecap="round"/><ellipse cx="-70" cy="-60" rx="80" ry="26" fill="#fff" opacity=".12" transform="rotate(-14 -70 -60)"/><ellipse cx="70" cy="125" rx="34" ry="22" fill="#4aa86b" transform="rotate(10 70 125)"/></g>`;
const stomach=(x,y,s)=>`<g transform="translate(${f(x)} ${f(y)}) scale(${s})"><path d="M-60,-170C-20,-190 20,-170 20,-130C20,-90 60,-80 100,-50C170,0 160,110 70,140C-10,170 -110,130 -120,50C-125,0 -90,-30 -80,-70C-75,-110 -90,-150 -60,-170Z" fill="url(#gStomach)" stroke="#8a3043" stroke-width="5"/><path d="M-70,-20C-40,10 20,0 60,30" fill="none" stroke="#a84552" stroke-width="5" opacity=".6" stroke-linecap="round"/><ellipse cx="-30" cy="-60" rx="24" ry="52" fill="#fff" opacity=".18" transform="rotate(18 -30 -60)"/></g>`;
const brain=(x,y,s,pulse=0)=>{let g='';const gy=[[-150,-90,-60,-130,10,-120],[-170,-30,-110,-60,-30,-40],[-60,-60,0,-110,60,-70],[20,-20,90,-70,150,-40],[-190,30,-120,0,-60,30],[-40,10,30,-30,100,10],[120,30,170,0,195,40],[-110,80,-40,50,20,80],[30,70,100,50,150,85]];gy.forEach(a=>g+=`<path d="M${a[0]},${a[1]}C${a[2]},${a[3]} ${a[4]},${a[5]} ${a[4]+30},${a[5]+20}" fill="none" stroke="#b44a6b" stroke-width="7" stroke-linecap="round" opacity=".7"/>`);return `<g transform="translate(${f(x)} ${f(y)}) scale(${s*(1+pulse*.02)})"><path d="M-30,110L-10,200C0,215 40,215 50,200L40,100Z" fill="#d97a93"/><ellipse cx="100" cy="120" rx="70" ry="42" fill="#c25a78" transform="rotate(-10 100 120)"/><path d="M-210,10C-230,-70 -170,-150 -90,-160C-60,-200 30,-205 70,-170C150,-175 220,-120 205,-40C230,0 215,70 170,90C150,140 80,150 40,125C10,160 -60,160 -80,120C-150,130 -220,90 -210,10Z" fill="url(#gBrain)" stroke="#a44866" stroke-width="5"/>${g}<ellipse cx="-90" cy="-100" rx="70" ry="24" fill="#fff" opacity=".2" transform="rotate(-20 -90 -100)"/></g>`};
const heart=(x,y,s)=>`<g transform="translate(${f(x)} ${f(y)}) scale(${f(s)})"><path d="M-30,-110C-40,-190 -10,-230 20,-225L30,-130Z" fill="#e0534a"/><path d="M30,-120C50,-190 110,-190 120,-150L60,-100Z" fill="#6aa7e8"/><path d="M0,70C-122,-26 -112,-120 -46,-126C-16,-128 0,-106 0,-90C0,-106 16,-128 46,-126C112,-120 122,-26 0,70Z" fill="url(#gHeart)" stroke="#6b0f20" stroke-width="4"/><path d="M-20,-60C-60,-70 -80,-40 -70,-10" fill="none" stroke="#fff" stroke-width="9" opacity=".25" stroke-linecap="round"/></g>`;
const bolt=(x,y,s,col='#ffd400',o=1)=>`<path transform="translate(${f(x)} ${f(y)}) scale(${s})" d="M6,-30L-14,4L-2,4L-8,30L14,-6L2,-6Z" fill="${col}" opacity="${o}" stroke="#fff6a0" stroke-width="2"/>`;
function fatCell(x,y,r,o=1){return `<g opacity="${o}">${glow(x,y,r*1.35,'gGold',.25)}<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="url(#gFat)" stroke="#d99227" stroke-width="5"/><ellipse cx="${f(x-r*.3)}" cy="${f(y-r*.35)}" rx="${f(r*.28)}" ry="${f(r*.16)}" fill="#fff" opacity=".6" transform="rotate(-30 ${f(x-r*.3)} ${f(y-r*.35)})"/><path d="M${f(x+r*.55)},${f(y+r*.55)}A${f(r*.78)},${f(r*.78)} 0 0 0 ${f(x+r*.9)},${f(y+r*.05)}" fill="none" stroke="#7a52a6" stroke-width="${f(r*.14)}" stroke-linecap="round"/></g>`}
function human(o={}){ // frente, pies en y=0, altura ~880
  const shirt=o.shirt??1, skin=o.skin??1, tilt=o.tilt??0;
  const sk=`url(#gSkin)`;
  const limb=(pts,w,c,cap='round')=>`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="${cap}" stroke-linejoin="round"/>`;
  return `<g opacity="${skin}">`+
   limb('-34,-330 -40,-170 -44,-24',58,'#2c3a5c')+limb('34,-330 40,-170 44,-24',58,'#2c3a5c')+
   `<ellipse cx="-48" cy="-6" rx="42" ry="14" fill="#1a2238"/><ellipse cx="48" cy="-6" rx="42" ry="14" fill="#1a2238"/>`+
   `<path d="M-84,-350C-96,-440 -118,-520 -112,-640C-100,-690 -60,-710 0,-712C60,-710 100,-690 112,-640C118,-520 96,-440 84,-350Z" fill="${sk}" stroke="#b9805a" stroke-width="3"/>`+
   limb('-112,-650 -142,-520 -134,-400',40,sk)+limb('112,-650 142,-520 134,-400',40,sk)+
   `<circle cx="-132" cy="-388" r="24" fill="${sk}"/><circle cx="132" cy="-388" r="24" fill="${sk}"/>`+
   `<rect x="-22" y="-760" width="44" height="60" rx="18" fill="${sk}"/><circle cx="0" cy="-820" r="64" fill="${sk}" stroke="#b9805a" stroke-width="3"/>`+
   `<path d="M-64,-830C-66,-896 -10,-912 36,-896C66,-884 70,-850 64,-830C50,-860 -20,-870 -64,-830Z" fill="#2b2226"/>`+
   `<circle cx="-22" cy="-816" r="6" fill="#2b2226"/><circle cx="22" cy="-816" r="6" fill="#2b2226"/><path d="M-20,-786Q0,-796 20,-786" fill="none" stroke="#8a4c3d" stroke-width="5" stroke-linecap="round"/>`+
   `<g opacity="${shirt}"><path d="M-112,-660C-100,-700 -60,-716 0,-718C60,-716 100,-700 112,-660L100,-350L-100,-350Z" fill="#3f7fd0"/>${limb('-112,-650 -128,-590',46,'#3f7fd0')}${limb('112,-650 128,-590',46,'#3f7fd0')}</g></g>`}

// ===================== fondo y HUD =====================
const SC=[
 {n:'01',t:'INTRODUCCIÓN',a:'#37d6ff',d:8},{n:'02',t:'LAS PRIMERAS HORAS',a:'#ffb347',d:8},{n:'03',t:'EL HÍGADO',a:'#ff8a65',d:8},
 {n:'04',t:'CAMBIO DE COMBUSTIBLE',a:'#ffd54f',d:8},{n:'05',t:'PRODUCCIÓN DE CETONAS',a:'#37d6ff',d:8},{n:'06',t:'EL CEREBRO',a:'#f48fb1',d:8},
 {n:'07',t:'LOS MÚSCULOS',a:'#ef5350',d:8},{n:'08',t:'CAMBIOS EN EL ORGANISMO',a:'#80cbc4',d:8},{n:'09',t:'LOS RIESGOS',a:'#ff4d5e',d:8},
 {n:'10',t:'NO TODO ES GRASA',a:'#ffd400',d:10},{n:'11',t:'FINAL',a:'#37d6ff',d:8}];
const STARTS=[];{let a=0;SC.forEach(c=>{STARTS.push(a);a+=c.d})}
function bg(T,acc,k){ // k=intensidad 0..1
  let s=`<rect width="1080" height="1920" fill="url(#gBg)"/>`;
  s+=glow(540,820,820,'gWhite',.05)+`<circle cx="540" cy="820" r="760" fill="${acc}" opacity="${.07+.05*Math.sin(T*.8)}"/>`;
  // rejilla científica sutil
  for(let i=0;i<10;i++){const y=(i*200+T*14)%2000-40;s+=`<line x1="0" y1="${f(y)}" x2="1080" y2="${f(y)}" stroke="#7fb3ff" stroke-opacity=".05" stroke-width="2"/>`}
  for(let i=0;i<7;i++){const x=i*180+30;s+=`<line x1="${x}" y1="0" x2="${x}" y2="1920" stroke="#7fb3ff" stroke-opacity=".04" stroke-width="2"/>`}
  for(let i=0;i<34;i++){const x=(rnd(i)*1080+Math.sin(T*.4+i)*40+1080)%1080,y=((rnd(i+50)*2000-T*(10+rnd(i+9)*20))%2000+2000)%2000-40;s+=circ(x,y,2+rnd(i+3)*5,acc,.12+.1*rnd(i+7))}
  return s}
function hud(T,i,lt,d){
  const c=SC[i],ia=E(lt,.15,.7)*(1-E(lt,d-.45,d));
  let s=`<rect width="1080" height="1920" fill="url(#gVig)"/>`;
  s+=`<g opacity="${ia}" transform="translate(0 ${f((1-ia)*-20)})"><rect x="70" y="96" width="940" height="92" rx="46" fill="#08142c" fill-opacity=".72" stroke="${c.a}" stroke-opacity=".8" stroke-width="3"/><circle cx="116" cy="142" r="30" fill="${c.a}"/><text x="116" y="154" font-size="32" fill="#06101f" text-anchor="middle">${c.n}</text><text x="168" y="155" font-size="40" fill="#fff" letter-spacing="1.5">${c.t}</text></g>`;
  // línea de tiempo sin cifras: la duración varía según la persona
  const k=T/90;
  s+=`<g opacity="${.9}"><line x1="90" y1="238" x2="990" y2="238" stroke="#ffffff30" stroke-width="8" stroke-linecap="round"/><line x1="90" y1="238" x2="${f(90+900*k)}" y2="238" stroke="${c.a}" stroke-width="8" stroke-linecap="round"/><circle cx="${f(90+900*k)}" cy="238" r="13" fill="#fff"/>`+txt(90,284,'SIN COMER',24,'#cfe3ff',.85,'start')+txt(990,284,'MÁS TIEMPO →',24,'#cfe3ff',.85,'end')+`</g>`;
  return s}

// ===================== ESCENAS =====================
const SCENES=[];
// ---- 1. Introducción: persona frente a mesa vacía -> cámara entra al abdomen
SCENES[0]=(t,d)=>{
  const k=lerp(.82,3.0,E(t,2.4,6.2)), fx=0, fy=lerp(-520,-540,E(t,2.4,6.2));
  const shirt=1-E(t,3.7,4.5), skin=1-.86*E(t,4.3,5.6);
  const org=E(t,4.0,5.0), pul=1+.04*Math.sin(t*5);
  let s=`<g transform="translate(540 ${f(lerp(1160,880,E(t,2.4,6.2)))}) scale(${f(k)}) translate(${-fx} ${f(-fy)})">`;
  // habitación
  s+=`<rect x="-900" y="-6" width="1800" height="900" fill="#101c38"/><line x1="-900" y1="-6" x2="900" y2="-6" stroke="#2c4574" stroke-width="3"/>`;
  s+=human({shirt,skin});
  // órganos dentro del torso (se revelan)
  s+=`<g opacity="${org}"><g clip-path="none">${liver(-28,-478,.27)}${stomach(36,-474,.22*pul)}`+
     `<path d="${poly(u=>[-70+u*140,-402+Math.sin(u*TAU*3)*14])}" fill="none" stroke="#e59a9a" stroke-width="22" stroke-linecap="round" opacity=".95"/>`+
     `<path d="${poly(u=>[-70+u*140,-402+Math.sin(u*TAU*3)*14])}" fill="none" stroke="#f7c1c1" stroke-width="9" stroke-linecap="round" opacity=".7"/>`+
     `<path d="${poly(u=>[0,-600+u*70])}" fill="none" stroke="#d98080" stroke-width="12" stroke-linecap="round"/>${heart(-8,-640,.2*pul)}</g></g>`;
  // línea de escaneo
  const sc=E(t,4.2,5.8);
  if(sc>0&&sc<1)s+=`<rect x="-120" y="${f(-690+sc*340)}" width="240" height="4" fill="#9ff3ff"/><rect x="-120" y="${f(-690+sc*340-26)}" width="240" height="26" fill="url(#gCyan)" opacity=".5"/>`;
  // mesa vacía en primer plano
  s+=`<path d="M-330,-330L330,-330L420,-240L-420,-240Z" fill="#6d4a31"/><rect x="-420" y="-240" width="840" height="26" rx="6" fill="#4c3322"/><rect x="-380" y="-214" width="24" height="214" fill="#3a2719"/><rect x="356" y="-214" width="24" height="214" fill="#3a2719"/>`;
  s+=`<ellipse cx="0" cy="-286" rx="120" ry="26" fill="#e9eef7"/><ellipse cx="0" cy="-288" rx="88" ry="17" fill="#cfd8e6"/>`;
  s+=`<g stroke="#c7cfdc" stroke-width="7" stroke-linecap="round"><line x1="-210" y1="-306" x2="-196" y2="-262"/><line x1="220" y1="-306" x2="205" y2="-262"/></g>`;
  s+=`</g>`;
  // pregunta
  s+=`<g opacity="${E(t,.6,1.4)*(1-E(t,2.6,3.2))}">${glow(540,700,260,'gCyan',.25)}${txt(540,820,'?',360,'#37d6ff',.95)}</g>`;
  s+=txt(540,1500,'7 DÍAS SIN COMER',70,'#ffd400',E(t,5.9,6.6)) + txt(540,1580,'¿qué sucede dentro del cuerpo?',34,'#cfe3ff',E(t,6.3,7))*1;
  return s};

// ---- 2. Estómago y digestión
SCENES[1]=(t,d)=>{
  let s='';const sx=360,sy=720;
  const intest=u=>[130+u*740,1180+Math.sin(u*TAU*3.2)*55];
  const vess=u=>[900-Math.sin(u*Math.PI)*60+u*0,1160-u*700];
  // esófago
  s+=tube(u=>[330,380+u*230],46,'#c95b63','#e58b92');
  s+=flow(u=>[330,380+u*230],5,.35,t,(x,y,a,i)=>circ(x,y,13+i%2*3,['#f5a623','#7cc576','#c98b5a'][i%3]));
  s+=stomach(sx,sy,1.3);
  // alimento que se digiere
  for(let i=0;i<16;i++){const dig=E(t,1+i*.1,5+i*.1),ang=t*1.2+i*1.7,rr=40+rnd(i)*80;const x=sx+Math.cos(ang)*rr*.8-20,y=sy+Math.sin(ang*1.1)*rr*.9+10;s+=circ(x,y,lerp(18,3,dig),['#f5a623','#7cc576','#c98b5a','#e8e1c8'][i%4],1-.3*dig)}
  // intestino
  s+=tube(intest,52,'#c96a73','#e9a0a6');
  s+=`<path d="M${f(sx+30)} ${f(sy+170)}C${f(sx+40)} ${f(sy+300)} 200 ${f(1000)} 150 1150" fill="none" stroke="#c96a73" stroke-width="46" stroke-linecap="round"/><path d="M${f(sx+30)} ${f(sy+170)}C${f(sx+40)} ${f(sy+300)} 200 1000 150 1150" fill="none" stroke="#e9a0a6" stroke-width="32" stroke-linecap="round"/>`;
  s+=flow(intest,10,.07,t,(x,y,a,i)=>glow(x,y,17,'gGold',.95*E(t,1.5+i*.1,2.4)),0);
  // vaso sanguíneo
  s+=tube(vess,64,'#6b1520','#a3222f');

  const na=lerp(-.35,-1.1,k);s+=`<circle cx="540" cy="580" r="92" fill="#0b1832" stroke="#7fb3ff" stroke-width="4"/><line x1="540" y1="580" x2="${f(540+Math.cos(na*Math.PI)*70)}" y2="${f(580+Math.sin(na*Math.PI)*70)}" stroke="#ffd400" stroke-width="9" stroke-linecap="round"/>${circ(540,580,10,'#fff')}`;
  s+=txt(540,830,'PESO ↓',46,'#ffd400',E(t,1,1.8))+`</g>`;
  s+=arrow(820,570,820,720,'#ff8a65',E(t,1.2,2),12);
  // vasos
  const bk=[['GLUCÓGENO','url(#gGly)',.78,.30,'#ffe082'],['AGUA','url(#gWater)',.82,.52,'#81d4fa'],['GRASA','url(#gFatL)',.86,.62,'#ffcc80'],['MÚSCULO','url(#gMusL)',.84,.70,'#f48fb1']];
  bk.forEach((b,i)=>{
    const x=70+i*235,w=200,top=950,h=330,o=E(t,.6+i*.35,1.4+i*.35);

    s+=`<g opacity="${o}"><path d="M${x} ${top}L${x} ${top+h-20}Q${x} ${top+h} ${x+22} ${top+h}L${x+w-22} ${top+h}Q${x+w} ${top+h} ${x+w} ${top+h-20}L${x+w} ${top}Z" fill="#0b1832" fill-opacity=".6"/><clipPath id="cp${i}"><path d="M${x} ${top}L${x} ${top+h-20}Q${x} ${top+h} ${x+22} ${top+h}L${x+w-22} ${top+h}Q${x+w} ${top+h} ${x+w} ${top+h-20}L${x+w} ${top}Z"/></clipPath><g clip-path="url(#cp${i})"><path d="${wv}" fill="${b[1]}"/>`;
    for(let j=0;j<4;j++)s+=circ(x+40+j*40+Math.sin(t*2+j+i)*6,top+h-((t*30+j*70+i*40)%(h*lvl)),5,'#fff',.35);

  s+=txt(540,1400,'El peso perdido puede incluir todo esto,',32,'#cfe3ff',E(t,4,5))+txt(540,1446,'no solo grasa',32,'#ffd400',E(t,4.4,5.2));
  s+=txt(540,1850,'Ilustración esquemática · sin cifras · varía según la persona',22,'#9fb4d6',.8);

// ---- 11. Final
SCENES[10]=(t,d)=>{
  const k=lerp(1.75,.92,E(t,0,5.5)),cy=lerp(560,870,E(t,0,5.5));

  s+=glow(0,-420,520,'gCyan',.12);
  s+=human({shirt:1-E(t,.2,1.2)*.97,skin:lerp(1,.18,E(t,.2,1.4))});
  // contorno brillante
  s+=`<path d="M-84,-350C-96,-440 -118,-520 -112,-640C-100,-690 -60,-710 0,-712C60,-710 100,-690 112,-640C118,-520 96,-440 84,-350Z" fill="none" stroke="#7ff0ff" stroke-width="5" opacity="${E(t,.4,1.2)}"/><circle cx="0" cy="-820" r="64" fill="none" stroke="#7ff0ff" stroke-width="5" opacity="${E(t,.4,1.2)}"/>`;
  const L=(i,x,y,r,id,col)=>{const o=E(t,1+i*.55,1.8+i*.55);return glow(x,y,r*2.6*(.9+.1*Math.sin(t*4+i)),id,.55*o)};
  s+=L(0,0,-820,60,'gRed')+ '';
  s+=`<g transform="translate(0 -826) scale(.17)" opacity="${E(t,1,1.8)}">${brain(0,0,1,Math.sin(t*3))}</g>`;
  s+=L(1,-8,-640,40,'gRed')+heart(-8,-636,.19*(1+.05*Math.sin(t*6)))*1;
  s+=`<g opacity="${E(t,2.1,2.9)}">${L(2,-28,-478,60,'gRed')}${liver(-28,-478,.27)}</g>`+`<g opacity="${E(t,2.6,3.4)}">${stomach(36,-474,.22)}</g>`;
  s+=`<g opacity="${E(t,3.1,3.9)}"><path d="${poly(u=>[-70+u*140,-402+Math.sin(u*TAU*3)*14])}" fill="none" stroke="#f4b1b1" stroke-width="22" stroke-linecap="round"/></g>`;
  // músculos brazos/piernas iluminados
  [[-128,-560],[128,-560],[-40,-200],[40,-200]].forEach((p,i)=>s+=glow(p[0],p[1],70,'gRed',.4*E(t,3.4+i*.2,4.2+i*.2)));
  s+=`</g></g>`;
  // rótulos de órganos
  const lab=(i,y,l,x,a)=>pill(x,y,l,'#9cf3ff',E(t,1.2+i*.5,2+i*.5),24);
  // texto final
  const tf=E(t,5.5,6.6);
  s+=`<rect x="0" y="1340" width="1080" height="300" fill="#050b1a" fill-opacity="${.7*tf}"/>`;
  s+=txt(540,1450,'EL CUERPO HUMANO ES INCREÍBLE,',52,'#ffffff',tf)+txt(540,1530,'PERO NO INVENCIBLE.',60,'#ffd400',tf);
  return s};

// ===================== render(t) =====================
function render(T){
  T=clamp(T,0,89.999);let i=0;while(i<10&&T>=STARTS[i+1])i++;
  const lt=T-STARTS[i],d=SC[i].d;
  const fi=E(lt,0,.55),fo=1-E(lt,d-.5,d);const al=fi*fo;
  document.getElementById('bg').innerHTML=bg(T,SC[i].a);
  document.getElementById('sc').innerHTML=`<g opacity="${f(al)}" transform="translate(0 ${f((1-fi)*30-(1-fo)*20)})">${SCENES[i](lt,d)}</g>`;
  document.getElementById('hud').innerHTML=hud(T,i,lt,d);
}
window.render=render;render(0);
</script></body></html>
